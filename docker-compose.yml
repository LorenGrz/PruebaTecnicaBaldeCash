services:
  db:
    image: postgres:16-alpine
    container_name: baldecash-db
    environment:
      POSTGRES_USER: ${DB_USER:-baldecash}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baldecash}
      POSTGRES_DB: ${DB_NAME:-baldecash}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-baldecash} -d ${DB_NAME:-baldecash}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-postgres:
